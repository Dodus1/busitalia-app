name: Build Android App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Installazione dipendenze
        run: |
          npm init -y
          npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/android@5 @capacitor/assets @capacitor/status-bar@5 @capacitor/splash-screen@5

      - name: Aggiungi piattaforma Android
        run: npx cap add android

      - name: Genera Icone Automatiche
        run: npx capacitor-assets generate --android --assetPath assets

      - name: Sincronizza Capacitor
        run: npx cap sync android

      - name: Risoluzione Conflitti Asset Nativi
        run: |
          # 1. Rimuoviamo TUTTI i file splash automatici che creano il quadrato nero/blu
          find android/app/src/main/res/ -name "splash*" -delete
          
          # 2. Ci assicuriamo che esistano le cartelle corrette
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/values-v31

          # 3. Copiamo la tua splash.png (2732x2732) come risorsa principale unica
          cp assets/splash.png android/app/src/main/res/drawable/splash.png

          # 4. Sovrascriviamo gli stili sia per Android vecchio che per Android 12+
          cp assets/android/styles.xml android/app/src/main/res/values/styles.xml
          cp assets/android/styles.xml android/app/src/main/res/values-v31/styles.xml

      - name: Build dell'applicazione
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Carica l'APK generato
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
