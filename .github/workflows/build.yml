name: Build Android App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del codice
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Installazione dipendenze
      run: |
        npm init -y
        npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/android@5 @capacitor/assets @capacitor/status-bar@5 @capacitor/splash-screen@5

    - name: Aggiungi piattaforma Android
      run: npx cap add android

    - name: Forza Splash Screen Bianco Nativo
      run: |
        echo '<?xml version="1.0" encoding="utf-8"?>
        <resources>
            <style name="AppTheme" parent="Theme.AppCompat.Light.DarkActionBar">
                <item name="colorPrimary">@color/colorPrimary</item>
                <item name="colorPrimaryDark">@color/colorPrimaryDark</item>
                <item name="colorAccent">@color/colorAccent</item>
            </style>
            <style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">
                <item name="windowSplashScreenBackground">#FFFFFF</item>
                <item name="windowSplashScreenAnimatedIcon">@mipmap/ic_launcher_foreground</item>
                <item name="postSplashScreenTheme">@style/AppTheme</item>
            </style>
        </resources>' > android/app/src/main/res/values/styles.xml

    - name: Genera Icone e Splash
      run: npx capacitor-assets generate --android --assetPath assets

    - name: Sincronizza Capacitor
      run: npx cap sync android

    - name: Build dell'applicazione (Generazione APK)
      run: |
        cd android
        ./gradlew assembleDebug

    - name: Carica l'APK generato nei file della build
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
