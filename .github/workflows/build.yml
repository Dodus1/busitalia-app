name: Build Android App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Installazione dipendenze
        run: |
          npm init -y
          npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/android@5 @capacitor/assets @capacitor/status-bar@5 @capacitor/splash-screen@5

      - name: Aggiungi piattaforma Android
        run: npx cap add android

      - name: Genera Icone Automatiche
        run: npx capacitor-assets generate --android --assetPath assets

      - name: Sincronizza Capacitor
        run: npx cap sync android

      - name: RASIA AL SUOLO CONFIGURAZIONE ANDROID 12
        run: |
          # 1. Cancelliamo le cartelle create da Capacitor che forzano l'icona blu quadrata
          rm -rf android/app/src/main/res/values-v31
          rm -rf android/app/src/main/res/drawable-v24
          
          # 2. Ci assicuriamo che esistano i percorsi base
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/drawable
          
          # 3. Copiamo il tuo splash.png originale pulito nei drawable
          cp assets/splash.png android/app/src/main/res/drawable/splash.png

          # 4. Creiamo il background nativo a schermo intero (Sfondo bianco + logo Busitalia centrato)
          cat << 'EOF' > android/app/src/main/res/drawable/splash_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@android:color/white" />
              <item>
                  <bitmap
                      android:src="@drawable/splash"
                      android:gravity="center" />
              </item>
          </layer-list>
          EOF

          # 5. Sovrascriviamo COMPLETAMENTE il tuo styles.xml eliminando "Theme.SplashScreen"
          # Sostituendolo con il background classico, l'icona blu sparisce e viene usato lo splash bianco
          cat << 'EOF' > android/app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="colorPrimary">#FFFFFF</item>
                  <item name="colorPrimaryDark">#FFFFFF</item>
                  <item name="colorAccent">#000000</item>
                  <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>
                  <item name="android:windowTranslucentStatus">true</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
              </style>
              
              <style name="AppTheme.NoActionBarLaunch" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:windowBackground">@drawable/splash_background</item>
                  <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>
                  <item name="android:windowTranslucentStatus">true</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
              </style>
          </resources>
          EOF

      - name: Build dell'applicazione
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Carica l'APK generato
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
