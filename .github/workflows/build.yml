name: Build Android App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Installazione dipendenze
        run: |
          npm init -y
          npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/android@5 @capacitor/assets @capacitor/status-bar@5 @capacitor/splash-screen@5

      - name: Aggiungi piattaforma Android
        run: npx cap add android

      - name: Genera Icone Automatiche
        run: npx capacitor-assets generate --android --assetPath assets

      - name: Sincronizza Capacitor
        run: npx cap sync android

      - name: Fix Radicale Splash Screen Android 12
        run: |
          # 1. Crea le cartelle necessarie se non esistono
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/values-v31
          
          # 2. Rimuove l'icona di default di capacitor che interferisce con il vecchio splash
          rm -f android/app/src/main/res/drawable/splash.png
          
          # 3. Copia il tuo splash originale da 2732x2732 nella cartella drawable
          cp assets/splash.png android/app/src/main/res/drawable/splash.png

          # 4. CREA IL LIVELLO NATIVO: Sfondo bianco + Immagine Centrata Correttamente
          cat << 'EOF' > android/app/src/main/res/drawable/splash_screen_native.xml
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@android:color/white" />
              <item>
                  <bitmap
                      android:src="@drawable/splash"
                      android:gravity="center" />
              </item>
          </layer-list>
          EOF

          # 5. Sovrascrive gli stili sia per i vecchi Android che per Android 12+ (-v31)
          cp assets/android/styles.xml android/app/src/main/res/values/styles.xml
          cp assets/android/styles.xml android/app/src/main/res/values-v31/styles.xml

      - name: Build dell'applicazione
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Carica l'APK generato
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
