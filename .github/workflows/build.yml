name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del codice
      uses: actions/checkout@v4

    - name: Configura Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Configura Java (richiesto per Android)
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Inizializza il progetto e installa Capacitor
      run: |
        npm init -y
        npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/android@5 @capacitor/assets

    - name: Aggiungi la piattaforma Android
      run: npx cap add android

    - name: Genera Icone e Splash Screen
      run: npx capacitor-assets generate

    - name: Sincronizza i file web
      run: npx cap sync android

    - name: Compila l'APK senza demoni di cache
      run: |
        cd android
        ./gradlew assembleDebug --no-daemon --clean

    - name: Carica l'APK finale nei download
      uses: actions/upload-artifact@v4
      with:
        name: Busitalia-Veneto-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
