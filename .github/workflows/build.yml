name: Build Android App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Installazione dipendenze
        run: |
          npm init -y
          npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/android@5 @capacitor/assets @capacitor/status-bar@5 @capacitor/splash-screen@5

      - name: Aggiungi piattaforma Android
        run: npx cap add android

      - name: Genera Icone e Splash Automatici
        run: npx capacitor-assets generate --android --assetPath assets

      - name: Sincronizza Capacitor
        run: npx cap sync android

      - name: AZZERA CONFIGURAZIONE ANDROID E FORZA SPLASH FULLSCREEN
        run: |
          # Elimina le cartelle dei valori che Capacitor usa per forzare le API Android 12+
          rm -rf android/app/src/main/res/values-v31
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/drawable
          
          # Copia lo splash originale direttamente nei drawable principali
          cp assets/splash.png android/app/src/main/res/drawable/splash.png

          # 1. Crea un layer-list classico che prende l'intera finestra (sfondo bianco + splash centrato o fill)
          cat << 'EOF' > android/app/src/main/res/drawable/splash_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@android:color/white" />
              <item>
                  <bitmap
                      android:src="@drawable/splash"
                      android:gravity="fill" />
              </item>
          </layer-list>
          EOF

          # 2. Riscrive lo styles.xml applicando il layer-list come sfondo del windowBackground.
          cat << 'EOF' > android/app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="colorPrimary">#FFFFFF</item>
                  <item name="colorPrimaryDark">#FFFFFF</item>
                  <item name="colorAccent">#000000</item>
                  <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>
                  <item name="android:windowTranslucentStatus">true</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
              </style>
              
              <style name="AppTheme.NoActionBarLaunch" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:windowBackground">@drawable/splash_background</item>
                  <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>
              </style>
          </resources>
          EOF

          # 3. Aggiorna il file MainActivity.java per forzare il comportamento a schermo intero nativo fin dal primo millisecondo
          find android/app/src/main/java -name "MainActivity.java" -exec sed -i '/super.onCreate/i \        if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.P) {\n            getWindow().getAttributes().layoutInDisplayCutoutMode = android.view.WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;\n        }' {} \;

      - name: Build dell'applicazione
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Carica l'APK generato
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
