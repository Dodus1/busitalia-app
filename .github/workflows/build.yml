name: Build Android App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Installazione dipendenze
        run: |
          npm init -y
          npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/android@5 @capacitor/assets @capacitor/status-bar@5 @capacitor/splash-screen@5

      - name: Aggiungi piattaforma Android
        run: npx cap add android

      - name: Genera Icone e Splash Automatici
        run: npx capacitor-assets generate --android --assetPath assets

      - name: Sincronizza Capacitor
        run: npx cap sync android

      - name: FORZA SPLASH.PNG E EDGE-TO-EDGE (Overriding Totale)
        run: |
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/values-v31
          mkdir -p android/app/src/main/res/drawable
          
          # Copiamo il file splash.png originale direttamente dalla tua cartella assets del repository
          # Questo evita l'errore "No such file or directory" e garantisce l'uso dell'immagine corretta
          cp assets/splash.png android/app/src/main/res/drawable/splash.png

          # 1. Configura il tema principale (Rende l'HTML immersivo sotto il notch)
          cat << 'EOF' > android/app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="colorPrimary">#FFFFFF</item>
                  <item name="colorPrimaryDark">#FFFFFF</item>
                  <item name="colorAccent">#000000</item>
                  <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>
                  <item name="android:windowTranslucentStatus">true</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
              </style>
              <style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">
                  <item name="windowSplashScreenBackground">#FFFFFF</item>
                  <item name="windowSplashScreenAnimatedIcon">@drawable/splash</item>
                  <item name="postSplashScreenTheme">@style/AppTheme</item>
              </style>
          </resources>
          EOF

          # 2. Crea il layer-list per evitare il ritaglio circolare di Android 12+
          cat << 'EOF' > android/app/src/main/res/drawable/splash_native.xml
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:gravity="fill" android:drawable="@drawable/splash" />
          </layer-list>
          EOF

          # 3. Specifica lo stile per Android 12+ usando il layer-list con gravity fill
          cat << 'EOF' > android/app/src/main/res/values-v31/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">
                  <item name="windowSplashScreenBackground">#FFFFFF</item>
                  <item name="windowSplashScreenAnimatedIcon">@drawable/splash_native</item>
                  <item name="postSplashScreenTheme">@style/AppTheme</item>
              </style>
          </resources>
          EOF

      - name: Build dell'applicazione
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Carica l'APK generato
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
