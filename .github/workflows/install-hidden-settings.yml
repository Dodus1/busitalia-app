name: Install hidden settings integration

on:
  push:
    paths:
      - '.github/workflows/install-hidden-settings.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Inject shared settings script
        shell: python
        run: |
          from pathlib import Path
          targets = [Path('www/index.html'), Path('www/ticket.html'), Path('www/biglietto.html')]
          tag = '    <script src="app-settings.js"></script>\n'
          for path in targets:
              text = path.read_text(encoding='utf-8')
              if 'app-settings.js' not in text:
                  text = text.replace('</body>', tag + '</body>')
                  path.write_text(text, encoding='utf-8')
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add www/index.html www/ticket.html www/biglietto.html
          git diff --cached --quiet && exit 0
          git commit -m "Wire hidden settings across app"
          git push origin main
